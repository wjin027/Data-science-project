name: User story
description: 描述用户目标、可检验需求、验收和团队任务。
title: "[Story] "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        先搜索已有 Issue。请在右侧选择 milestone 和 assignee；协作流程见 docs/team/COLLABORATION.md。
        用户故事描述使用者获得的结果，技术实现可以随后讨论。
  - type: textarea
    id: story
    attributes:
      label: User story
      description: As a [role], I want [goal], so that [benefit].
      placeholder: "As a reader, I want ..., so that ..."
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Supporting requirements
      description: 具体、可检验的行为与质量要求；包括适用的空结果或失败情况。
      placeholder: |
        - 当……时，应用应……
        - 如果……失败，使用者可以……
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 写明前置条件、操作和预期结果，让另一位成员可以独立判断完成。
      placeholder: |
        - [ ] 在……条件下执行……，应看到……
        - [ ] 执行……后，原有……仍然正常
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 任务、负责人和估点
      description: 直接在同一个 Issue 中维护 checklist；每项写负责人。点数需团队讨论，可用 1/2/3/5/8。
      placeholder: |
        Story points：待团队讨论
        任务点数是否计入整体点数：说明采用方式，避免重复统计
        - [ ] 明确行为与实现方案 — @负责人 — 待估点
        - [ ] 实现并检查相关单元测试 — @负责人 — 待估点
        - [ ] 验收、文档与 demo — @负责人 — 待估点
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围、依赖和待确认事项
      description: 包括 TA 讨论状态、关联 Issue 和影响范围；没有则写“无”。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: PR、验证结果与 demo（随进展更新）
      description: 实际完成后添加链接、验收人员、结果和可复现的 demo 步骤；不要预填成功。
      placeholder: |
        关联 PR：
        测试 / Actions 运行：
        验收步骤与实际结果：
        Demo：
        已知限制：
