name: Bug report
description: 用最小复现、预期与实际行为记录缺陷。
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issue，并选择 assignee 和 milestone。不要上传包含账号、密钥或私人路径的日志及截图。
  - type: textarea
    id: impact
    attributes:
      label: 问题及用户影响
      description: 谁在什么操作中遇到什么问题？
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 复现环境
      description: APK 对应 commit / Actions 链接、Android 版本、必要前提；不填写私人主机信息。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现步骤
      placeholder: |
        1. 准备……
        2. 打开……
        3. 执行……
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 预期与实际结果
      placeholder: |
        预期：
        实际：
        复现频率：
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 修复验收标准
      description: 说明怎样确认原问题已解决，以及需保持正常的相关行为。
      placeholder: |
        - [ ] 原复现步骤得到预期结果
        - [ ] 相关回归检查通过
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 任务、负责人和估点
      placeholder: |
        Story points：待团队讨论（1/2/3/5/8）
        - [ ] 定位问题并确认复现 — @负责人 — 待估点
        - [ ] 修复并验证原失败与相关回归 — @负责人 — 待估点
        - [ ] 更新验收与 demo 结果 — @负责人 — 待估点
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 证据、PR 和结果（随进展更新）
      description: 可添加已脱敏的日志、截图、修复前后结果、PR 链接和 demo 步骤。
